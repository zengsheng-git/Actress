<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0d14">
  <title>作品数据浏览器</title>
  <script>
    /* 首屏前应用主题，避免闪烁 */
    (function () {
      var t = 'dark';
      try { t = JSON.parse(localStorage.getItem('data-browser:theme') || '"dark"'); } catch (e) {}
      if (t === 'light') document.documentElement.dataset.theme = 'light';
    })();
  </script>
  <style>html { background: #0a0d14 }</style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
